# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  CI — YOPOEPRINT (monorepo)                                             ║
# ║  storefront (racine) · yopoeprint-admin · yopoeprint-api                ║
# ╚══════════════════════════════════════════════════════════════════════════╝

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Un nouveau push annule le run précédent sur la même branche / PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1
  # Valeur factice : le build ne doit dépendre d'aucune API joignable
  NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1

jobs:
  build:
    name: ${{ matrix.app }} — lint · build · typecheck
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: storefront
            dir: .
            lint: true
            typecheck: npx tsc --noEmit
          - app: admin
            dir: yopoeprint-admin
            # Pas encore de script lint ni de config ESLint dans l'admin
            lint: false
            typecheck: npx tsc --noEmit
          - app: api
            dir: yopoeprint-api
            # Le script lint existe mais eslint n'est ni installé ni configuré
            lint: false
            typecheck: npx tsc --noEmit -p tsconfig.json
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        if: ${{ matrix.lint }}
        run: npm run lint

      # Build avant le typecheck : next-env.d.ts (non versionné) est généré par next build
      - name: Build
        run: npm run build

      - name: Typecheck
        run: ${{ matrix.typecheck }}

  e2e:
    name: storefront — E2E Playwright
    runs-on: ubuntu-latest
    needs: build
    # Les parcours produit / commande appellent l'API, absente en CI : non bloquant
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Start storefront
        run: |
          npm start > next-start.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000 > /dev/null && exit 0
            sleep 2
          done
          cat next-start.log
          exit 1

      - name: Run E2E
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
